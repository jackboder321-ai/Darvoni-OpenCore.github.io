<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Testing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif}

body{
height:100vh;
overflow:hidden;
background:url("https://picsum.photos/1920/1080?blur=2") no-repeat center/cover;
color:white;
}

/* MICA EFFECT */
.mica{
backdrop-filter:blur(30px);
background:rgba(255,255,255,0.1);
}

/* TASKBAR */
.taskbar{
position:absolute;
bottom:0;
width:100%;
height:50px;
display:flex;
align-items:center;
justify-content:center;
}
.taskbar button{
width:45px;height:45px;
background:transparent;
border:none;
color:white;
font-size:20px;
cursor:pointer;
transition:.3s;
}
.taskbar button:hover{transform:scale(1.2)}

/* WINDOW */
.window{
position:absolute;
width:500px;
height:400px;
top:80px;
left:100px;
border-radius:15px;
overflow:hidden;
display:none;
}
.titlebar{
height:35px;
background:rgba(0,0,0,0.3);
display:flex;
justify-content:space-between;
align-items:center;
padding:5px 10px;
cursor:move;
}
.controls span{
margin-left:10px;
cursor:pointer;
}
.content{padding:15px}

/* COMMAND BAR */
.commandbar{
display:flex;
gap:10px;
margin-bottom:10px;
}
.commandbar button{
padding:5px 10px;
background:rgba(255,255,255,0.2);
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

/* TOGGLE */
.toggle.active{background:lime;color:black}

/* NOTIFICATIONS */
.notification{
position:absolute;
right:20px;
bottom:70px;
width:300px;
padding:15px;
border-radius:10px;
display:none;
}

/* PROGRESS */
.progress{
width:100%;
height:10px;
background:rgba(255,255,255,0.2);
border-radius:5px;
overflow:hidden;
margin-top:10px;
}
.progress-bar{
height:100%;
width:60%;
background:lime;
}

/* MODAL */
.modal{
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
}
.modal-content{
width:300px;
padding:20px;
border-radius:15px;
}

</style>
</head>

<body>

<!-- NOTIFICATION -->
<div class="notification mica" id="notif">
<h3 id="notifTitle"></h3>
<p id="notifText"></p>
<div class="progress"><div class="progress-bar"></div></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content mica">
<h3>Modal Window</h3>
<p>Message important</p>
<button onclick="closeModal()">OK</button>
</div>
</div>

<!-- WINDOW -->
<div class="window mica" id="appWindow">
<div class="titlebar" id="dragArea">
<span>WebOS App</span>
<div class="controls">
<span onclick="minimize()">🗕</span>
<span onclick="maximize()">🗖</span>
<span onclick="closeWindow()">✖</span>
</div>
</div>

<div class="content">

<div class="commandbar">
<button onclick="showNotification()">Notify</button>
<button onclick="showProgress()">Progress</button>
<button onclick="openModal()">Modal</button>
<button class="toggle" onclick="toggleBtn(this)">Toggle</button>
</div>

<p>App style Windows 11 simulée.</p>

</div>
</div>

<!-- TASKBAR -->
<div class="taskbar mica">
<button onclick="openWindow()">⊞</button>
</div>

<script>

let win=document.getElementById("appWindow")
let drag=document.getElementById("dragArea")

function openWindow(){win.style.display="block"}
function closeWindow(){win.style.display="none"}
function minimize(){win.style.display="none"}

function maximize(){
if(win.style.width!="100%"){
win.style.top="0"
win.style.left="0"
win.style.width="100%"
win.style.height="100%"
}else{
win.style.width="500px"
win.style.height="400px"
win.style.top="80px"
win.style.left="100px"
}
}

/* DRAG */
let offsetX=0,offsetY=0,isDrag=false
drag.addEventListener("mousedown",e=>{
isDrag=true
offsetX=e.clientX-win.offsetLeft
offsetY=e.clientY-win.offsetTop
})
document.addEventListener("mousemove",e=>{
if(!isDrag)return
win.style.left=(e.clientX-offsetX)+"px"
win.style.top=(e.clientY-offsetY)+"px"
})
document.addEventListener("mouseup",()=>isDrag=false)

/* NOTIFICATIONS */
function showNotification(){
let n=document.getElementById("notif")
document.getElementById("notifTitle").innerText="Welcome"
document.getElementById("notifText").innerText="Notification style WinUI"
n.style.display="block"
setTimeout(()=>n.style.display="none",4000)
}

function showProgress(){
let n=document.getElementById("notif")
document.getElementById("notifTitle").innerText="Progress"
document.getElementById("notifText").innerText="60% complete"
n.style.display="block"
}

/* MODAL */
function openModal(){
document.getElementById("modal").style.display="flex"
}
function closeModal(){
document.getElementById("modal").style.display="none"
}

/* TOGGLE */
function toggleBtn(el){
el.classList.toggle("active")
}

/* KEYBOARD CTRL+S */
document.addEventListener("keydown",e=>{
if(e.ctrlKey && e.key==="s"){
e.preventDefault()
alert("CTRL+S détecté (simulation Save)")
}
})

</script>

</body>
</html>
